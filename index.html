function sheetCsvUrl(sheetName) {
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;

async function fetchSheetRows(sheetName) {

function groupTagihanRows(rows) {
  const map = new Map();
  rows.forEach((r, i) => {
    const key = String(r.Nama);
    if (!map.has(key)) {
      map.set(key, { id: `t-${Date.now()}-${i}`, nama: String(r.Nama), items: [], total: 0, lunas: true });
    }
    const g = map.get(key);
    const nilai = Number(r.Tagihan) || 0;
    g.items.push({ id: `ti-${Date.now()}-${i}`, batch: String(r.Batch), item: String(r.Barang), tagihan: nilai });
    g.total += nilai;
    if (String(r.Lunas).toLowerCase() !== "ya") g.lunas = false;
  });
  return Array.from(map.values());
}

function currency(n) {
  return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(n || 0);
}

function UploadCard({ title, hint, templateHeaders, templateExample, fileName, onParsed }) {
  const inputRef = useRef(null);
  const [state, setState] = useState({ status: "idle", msg: "", count: 0 });

  const downloadTemplate = () => {
    const ws = XLSX.utils.json_to_sheet([templateExample], { header: templateHeaders });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Template");
    XLSX.writeFile(wb, fileName);
  };

  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setState({ status: "loading", msg: "", count: 0 });
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
      const missing = templateHeaders.filter((h) => !(h in (rows[0] || {})));
      if (rows.length === 0) {
        setState({ status: "error", msg: "File kosong atau format tidak terbaca.", count: 0 });
        return;
      }
      if (missing.length > 0) {
        setState({ status: "error", msg: `Kolom hilang: ${missing.join(", ")}`, count: 0 });
        return;
      }
      onParsed(rows);
      setState({ status: "success", msg: "", count: rows.length });
    } catch (err) {
      setState({ status: "error", msg: "Gagal membaca file. Pastikan formatnya .xlsx atau .csv.", count: 0 });
    } finally {
      if (inputRef.current) inputRef.current.value = "";
    }
  };

  return (
    <div className="upload-card">
      <div className="upload-card-head">
        <h3>{title}</h3>
        <button className="ghost-btn" onClick={downloadTemplate}>
          <DownloadIcon size={13} /> Unduh template
        </button>
      </div>
      <p className="upload-hint">{hint}</p>
      <label className="dropzone">
        <UploadIcon size={18} />
        <span>Klik untuk pilih file .xlsx / .csv</span>
        <input ref={inputRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} hidden />
      </label>
      {state.status === "loading" && <p className="upload-status neutral">Membaca file…</p>}
      {state.status === "success" && <p className="upload-status ok">Berhasil — {state.count} baris diperbarui &amp; langsung tayang di tampilan publik.</p>}
      {state.status === "error" && <p className="upload-status err">{state.msg}</p>}
    </div>
  );
}

function GoTracker() {
  const [rekap, setRekap] = useState(SEED_REKAP);
  const [tagihan, setTagihan] = useState(() => groupTagihanRows(SEED_TAGIHAN_RAW));
  const saveRekap = setRekap;
  const saveTagihan = setTagihan;

  const [syncStatus, setSyncStatus] = useState("loading"); // loading | live | error
  const [syncError, setSyncError] = useState("");
  const [lastSynced, setLastSynced] = useState(null);

  function mapRekapRow(r, i) {
    return {
      id: `r-${i}-${r.Nama}-${r.Item}`,
      batch: Number(r.Batch),
      asal: String(r.Asal || "").toUpperCase(),
      nama: String(r.Nama || ""),
      item: String(r.Item || ""),
      jumlah: Number(r.Jumlah) || 1,
      status: STATUS_STEPS.includes(r.Status) ? r.Status : "Checkout",
    };
  }

  const syncFromSheets = async () => {
    setSyncStatus("loading");
    setSyncError("");
    try {
      const [rekapRows, tagihanRows] = await Promise.all([
        fetchSheetRows(REKAP_SHEET_NAME),
        fetchSheetRows(TAGIHAN_SHEET_NAME),
      ]);
      if (rekapRows.length > 0) saveRekap(rekapRows.map(mapRekapRow));
      if (tagihanRows.length > 0) saveTagihan(groupTagihanRows(tagihanRows));
      setSyncStatus("live");
      setLastSynced(new Date());
    } catch (err) {
      console.error(err);
      setSyncStatus("error");
      setSyncError("Belum berhasil konek ke Google Sheets — menampilkan data contoh terakhir.");
    }
  };

  useEffect(() => { syncFromSheets(); }, []);

  const [role, setRole] = useState("publik");
  const [tab, setTab] = useState("rekap");
  const [query, setQuery] = useState("");
  const [batchFilter, setBatchFilter] = useState("Semua");
  const [asalFilter, setAsalFilter] = useState("Semua");
  const [statusFilter, setStatusFilter] = useState("Semua");

  const batches = useMemo(() => ["Semua", ...Array.from(new Set(rekap.map((r) => r.batch))).sort((a, b) => b - a)], [rekap]);

  const filteredRekap = useMemo(() => {
    return rekap.filter((r) => {
      if (query && !r.nama.toLowerCase().includes(query.toLowerCase())) return false;
      if (batchFilter !== "Semua" && r.batch !== Number(batchFilter)) return false;
      if (asalFilter !== "Semua" && r.asal !== asalFilter) return false;
      if (statusFilter !== "Semua" && r.status !== statusFilter) return false;
      return true;
    });
  }, [rekap, query, batchFilter, asalFilter, statusFilter]);

  const groupedRekap = useMemo(() => {
    const byBatch = new Map();
    filteredRekap.forEach((r) => {
      if (!byBatch.has(r.batch)) byBatch.set(r.batch, []);
      byBatch.get(r.batch).push(r);
    });
    return Array.from(byBatch.entries()).sort((a, b) => b[0] - a[0]);
  }, [filteredRekap]);

  const filteredTagihan = useMemo(() => {
    return tagihan
      .filter((t) => {
        if (query && !t.nama.toLowerCase().includes(query.toLowerCase())) return false;
        if (batchFilter !== "Semua" && !t.items.some((it) => String(it.batch).includes(String(batchFilter)))) return false;
        return true;
      })
      .map((t) => ({
        ...t,
        items: batchFilter === "Semua" ? t.items : t.items.filter((it) => String(it.batch).includes(String(batchFilter))),
      }));
  }, [tagihan, query, batchFilter]);

  return (
    <div className="app">
      <div className="header">
        <div className="brand">
          <div className="brand-mark"><BoxIcon size={17} /></div>
          <div>
            <h1>GO Tracker</h1>
            <p>Rekap barang &amp; tagihan group order</p>
          </div>
        </div>
        <div className="role-toggle">
          <button className={role === "publik" ? "active" : ""} onClick={() => setRole("publik")}>Tampilan Publik</button>
          <button className={role === "admin" ? "active" : ""} onClick={() => setRole("admin")}>Tampilan Admin</button>
        </div>
      </div>
      <div className={`sync-note ${syncStatus}`}>
        {syncStatus === "loading" && "Memuat data terbaru dari Google Sheets…"}
        {syncStatus === "live" && lastSynced && `Data live dari Google Sheets · diperbarui ${lastSynced.toLocaleTimeString("id-ID")}`}
        {syncStatus === "error" && syncError}
        <button className="sync-refresh" onClick={syncFromSheets}>⟳ Refresh</button>
      </div>

      <div className="content">
        {role === "admin" ? (
          <>
            <div className="admin-intro">
              Data situs ini sekarang otomatis dari Google Sheets kamu — admin cukup edit Sheets seperti biasa, tidak perlu upload apa pun di sini.
              Fitur upload di bawah ini hanya untuk pratinjau cepat di browser kamu sendiri (tidak mengubah data Sheets, dan hilang saat halaman di-refresh).
            </div>
            <div className="admin-grid">
              <UploadCard
                title="Rekap Barang"
                hint="Kolom: Batch, Asal, Nama, Item, Jumlah, Status."
                fileName="template_rekap_barang.xlsx"
                templateHeaders={["Batch", "Asal", "Nama", "Item", "Jumlah", "Status"]}
                templateExample={{ Batch: 13, Asal: "KR", Nama: "Contoh Nama", Item: "PC Contoh Grup - Contoh Member", Jumlah: 1, Status: "Checkout" }}
                onParsed={(rows) => {
                  const mapped = rows.map((r, i) => ({
                    id: `r-${Date.now()}-${i}`,
                    batch: Number(r.Batch),
                    asal: String(r.Asal).toUpperCase(),
                    nama: String(r.Nama),
                    item: String(r.Item),
                    jumlah: Number(r.Jumlah) || 1,
                    status: STATUS_STEPS.includes(r.Status) ? r.Status : "Checkout",
                  }));
                  saveRekap(mapped);
                }}
              />
              <UploadCard
                title="Data Tagihan"
                hint="Kolom: Nama, Batch, Barang, Tagihan, Lunas. Satu baris = satu barang; baris dengan Nama+Batch yang sama otomatis digabung."
                fileName="template_tagihan.xlsx"
                templateHeaders={["Nama", "Batch", "Barang", "Tagihan", "Lunas"]}
                templateExample={{ Nama: "Contoh Nama", Batch: "13 KR", Barang: "Contoh barang", Tagihan: 100000, Lunas: "Tidak" }}

                        <th>Batch</th>
                        <th>Barang Diorder</th>
                        <th>Tagihan</th>
                        <th>Total Tagihan</th>
                        <th>Check Pelunasan</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredTagihan.map((g) =>
                        g.items.map((item, idx) => (
                          <tr key={item.id}>
                            {idx === 0 && <td className="td-nama" rowSpan={g.items.length}>{g.nama}</td>}
                            <td className="td-center">{item.batch}</td>
                            <td>{item.item}</td>
                            <td className="td-right">{currency(item.tagihan)}</td>
                            {idx === 0 && <td className="td-right td-total" rowSpan={g.items.length}>{currency(g.total)}</td>}
                            {idx === 0 && (
                              <td className="td-center" rowSpan={g.items.length}>
                                <label className="pelunasan-cell">
                                  <input type="checkbox" checked={g.lunas} disabled className="pelunasan-check" />
                                  <span className={`pelunasan-label ${g.lunas ? "lunas" : "belum"}`}>{g.lunas ? "Lunas" : "Belum Lunas"}</span>
                                </label>
                              </td>
                            )}
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              )
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GoTracker />);
</script>
