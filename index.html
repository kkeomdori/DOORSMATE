<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GO Tracker</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef } = React;

/* ---------- small inline icons (no external icon library needed) ---------- */
const Icon = ({ path, size = 16 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {path}
  </svg>
);
const UploadIcon = (p) => <Icon {...p} path={<><path d="M12 3v12" /><path d="M7 8l5-5 5 5" /><path d="M4 21h16" /></>} />;
const SearchIcon = (p) => <Icon {...p} path={<><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></>} />;
const DownloadIcon = (p) => <Icon {...p} path={<><path d="M12 3v12" /><path d="M7 10l5 5 5-5" /><path d="M4 21h16" /></>} />;
const ResetIcon = (p) => <Icon {...p} path={<><path d="M21 12a9 9 0 1 1-3-6.7" /><path d="M21 3v6h-6" /></>} />;
const BoxIcon = (p) => <Icon {...p} path={<><path d="M21 8l-9-5-9 5 9 5 9-5z" /><path d="M3 8v8l9 5 9-5V8" /><path d="M12 13v8" /></>} />;

/* ---------- data ---------- */
const STATUS_STEPS = ["Checkout", "WH Luar Negeri", "WH Indonesia", "Tagihan", "Sampai di Rumah Admin"];

const STATUS_COLOR = {
  "Checkout": "#6B7686",
  "WH Luar Negeri": "#C98A2B",
  "WH Indonesia": "#B8801F",
  "Tagihan": "#D1503B",
  "Sampai di Rumah Admin": "#3F8F5F",
};

const ORIGIN_COLOR = { KR: "#3A6EA5", JP: "#C13E63", CN: "#C98A2B" };

const SEED_REKAP = [
  { id: "r1", batch: 12, asal: "KR", nama: "Aya Nurul", item: "PC NewJeans Danielle - Ditto", jumlah: 2, status: "WH Indonesia" },
  { id: "r2", batch: 12, asal: "KR", nama: "Bunga Sari", item: "Album LE SSERAFIM EASY", jumlah: 1, status: "Checkout" },
  { id: "r3", batch: 12, asal: "JP", nama: "Cindy Marsha", item: "PC Sakurazaka46 - single 5th", jumlah: 3, status: "WH Luar Negeri" },
  { id: "r4", batch: 11, asal: "CN", nama: "Dewi Anjani", item: "Lightstick TWS ver.2", jumlah: 1, status: "Sampai di Rumah Admin" },
  { id: "r5", batch: 12, asal: "KR", nama: "Aya Nurul", item: "PC IVE Wonyoung - I've Mine", jumlah: 1, status: "Tagihan" },
  { id: "r6", batch: 11, asal: "JP", nama: "Erlangga Putri", item: "Photobook Nogizaka46", jumlah: 1, status: "Sampai di Rumah Admin" },
];

const SEED_TAGIHAN = [
  { id: "g1", nama: "Aya Nurul", batch: "12 KR", items: [
      { id: "i1", item: "PC NewJeans Danielle - Ditto", tagihan: 150000 },
      { id: "i2", item: "PC IVE Wonyoung - I've Mine", tagihan: 135000 },
    ], total: 285000, lunas: false },
  { id: "g2", nama: "Bunga Sari", batch: "12 KR", items: [
      { id: "i3", item: "Album LE SSERAFIM EASY", tagihan: 95000 },
    ], total: 95000, lunas: false },
  { id: "g3", nama: "Dewi Anjani", batch: "11 CN", items: [
      { id: "i4", item: "Lightstick TWS ver.2", tagihan: 210000 },
    ], total: 210000, lunas: true },
  { id: "g4", nama: "Erlangga Putri", batch: "11 JP", items: [
      { id: "i5", item: "Photobook Nogizaka46", tagihan: 175000 },
    ], total: 175000, lunas: true },
];

function groupTagihanRows(rows) {
  const map = new Map();
  rows.forEach((r, i) => {
    const key = `${r.Nama}||${r.Batch}`;
    if (!map.has(key)) {
      map.set(key, { id: `t-${Date.now()}-${i}`, nama: String(r.Nama), batch: String(r.Batch), items: [], total: 0, lunas: true });
    }
    const g = map.get(key);
    const nilai = Number(r.Tagihan) || 0;
    g.items.push({ id: `ti-${Date.now()}-${i}`, item: String(r.Barang), tagihan: nilai });
    g.total += nilai;
    if (String(r.Lunas).toLowerCase() !== "ya") g.lunas = false;
  });
  return Array.from(map.values());
}

function currency(n) {
  return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(n || 0);
}

function UploadCard({ title, hint, templateHeaders, templateExample, fileName, onParsed }) {
  const inputRef = useRef(null);
  const [state, setState] = useState({ status: "idle", msg: "", count: 0 });

  const downloadTemplate = () => {
    const ws = XLSX.utils.json_to_sheet([templateExample], { header: templateHeaders });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Template");
    XLSX.writeFile(wb, fileName);
  };

  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setState({ status: "loading", msg: "", count: 0 });
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
      const missing = templateHeaders.filter((h) => !(h in (rows[0] || {})));
      if (rows.length === 0) {
        setState({ status: "error", msg: "File kosong atau format tidak terbaca.", count: 0 });
        return;
      }
      if (missing.length > 0) {
        setState({ status: "error", msg: `Kolom hilang: ${missing.join(", ")}`, count: 0 });
        return;
      }
      onParsed(rows);
      setState({ status: "success", msg: "", count: rows.length });
    } catch (err) {
      setState({ status: "error", msg: "Gagal membaca file. Pastikan formatnya .xlsx atau .csv.", count: 0 });
    } finally {
      if (inputRef.current) inputRef.current.value = "";
    }
  };

  return (
    <div className="upload-card">
      <div className="upload-card-head">
        <h3>{title}</h3>
        <button className="ghost-btn" onClick={downloadTemplate}>
          <DownloadIcon size={13} /> Unduh template
        </button>
      </div>
      <p className="upload-hint">{hint}</p>
      <label className="dropzone">
        <UploadIcon size={18} />
        <span>Klik untuk pilih file .xlsx / .csv</span>
        <input ref={inputRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} hidden />
      </label>
      {state.status === "loading" && <p className="upload-status neutral">Membaca file…</p>}
      {state.status === "success" && <p className="upload-status ok">Berhasil — {state.count} baris diperbarui &amp; langsung tayang di tampilan publik.</p>}
      {state.status === "error" && <p className="upload-status err">{state.msg}</p>}
    </div>
  );
}

function GoTracker() {
  const [rekap, setRekap] = useState(SEED_REKAP);
  const [tagihan, setTagihan] = useState(SEED_TAGIHAN);
  const saveRekap = setRekap;
  const saveTagihan = setTagihan;

  const [role, setRole] = useState("publik");
  const [tab, setTab] = useState("rekap");
  const [query, setQuery] = useState("");
  const [batchFilter, setBatchFilter] = useState("Semua");
  const [asalFilter, setAsalFilter] = useState("Semua");
  const [statusFilter, setStatusFilter] = useState("Semua");

  const batches = useMemo(() => ["Semua", ...Array.from(new Set(rekap.map((r) => r.batch))).sort((a, b) => b - a)], [rekap]);

  const filteredRekap = useMemo(() => {
    return rekap.filter((r) => {
      if (query && !r.nama.toLowerCase().includes(query.toLowerCase())) return false;
      if (batchFilter !== "Semua" && r.batch !== Number(batchFilter)) return false;
      if (asalFilter !== "Semua" && r.asal !== asalFilter) return false;
      if (statusFilter !== "Semua" && r.status !== statusFilter) return false;
      return true;
    });
  }, [rekap, query, batchFilter, asalFilter, statusFilter]);

  const groupedRekap = useMemo(() => {
    const byBatch = new Map();
    filteredRekap.forEach((r) => {
      if (!byBatch.has(r.batch)) byBatch.set(r.batch, []);
      byBatch.get(r.batch).push(r);
    });
    return Array.from(byBatch.entries()).sort((a, b) => b[0] - a[0]);
  }, [filteredRekap]);

  const filteredTagihan = useMemo(() => {
    return tagihan.filter((t) => {
      if (query && !t.nama.toLowerCase().includes(query.toLowerCase())) return false;
      if (batchFilter !== "Semua" && !String(t.batch).includes(String(batchFilter))) return false;
      return true;
    });
  }, [tagihan, query, batchFilter]);

  return (
    <div className="app">
      <div className="header">
        <div className="brand">
          <div className="brand-mark"><BoxIcon size={17} /></div>
          <div>
            <h1>GO Tracker</h1>
            <p>Rekap barang &amp; tagihan group order</p>
          </div>
        </div>
        <div className="role-toggle">
          <button className={role === "publik" ? "active" : ""} onClick={() => setRole("publik")}>Tampilan Publik</button>
          <button className={role === "admin" ? "active" : ""} onClick={() => setRole("admin")}>Tampilan Admin</button>
        </div>
      </div>
      <div className="demo-note">Demo — di versi live, data ini tersambung ke Google Sheets yang kamu kelola.</div>

      <div className="content">
        {role === "admin" ? (
          <>
            <div className="admin-intro">
              Upload file Excel di bawah untuk memperbarui data. Setelah berhasil, tampilan publik langsung ikut berubah — tidak perlu langkah tambahan.
            </div>
            <div className="admin-grid">
              <UploadCard
                title="Rekap Barang"
                hint="Kolom: Batch, Asal, Nama, Item, Jumlah, Status."
                fileName="template_rekap_barang.xlsx"
                templateHeaders={["Batch", "Asal", "Nama", "Item", "Jumlah", "Status"]}
                templateExample={{ Batch: 13, Asal: "KR", Nama: "Contoh Nama", Item: "PC Contoh Grup - Contoh Member", Jumlah: 1, Status: "Checkout" }}
                onParsed={(rows) => {
                  const mapped = rows.map((r, i) => ({
                    id: `r-${Date.now()}-${i}`,
                    batch: Number(r.Batch),
                    asal: String(r.Asal).toUpperCase(),
                    nama: String(r.Nama),
                    item: String(r.Item),
                    jumlah: Number(r.Jumlah) || 1,
                    status: STATUS_STEPS.includes(r.Status) ? r.Status : "Checkout",
                  }));
                  saveRekap(mapped);
                }}
              />
              <UploadCard
                title="Data Tagihan"
                hint="Kolom: Nama, Batch, Barang, Tagihan, Lunas. Satu baris = satu barang; baris dengan Nama+Batch yang sama otomatis digabung."
                fileName="template_tagihan.xlsx"
                templateHeaders={["Nama", "Batch", "Barang", "Tagihan", "Lunas"]}
                templateExample={{ Nama: "Contoh Nama", Batch: "13 KR", Barang: "Contoh barang", Tagihan: 100000, Lunas: "Tidak" }}
                onParsed={(rows) => {
                  saveTagihan(groupTagihanRows(rows));
                }}
              />
            </div>
            <div className="reset-row">
              <button onClick={() => { saveRekap(SEED_REKAP); saveTagihan(SEED_TAGIHAN); }}>
                <ResetIcon size={12} /> Reset ke data contoh
              </button>
            </div>
          </>
        ) : (
          <>
            <div className="subtabs">
              <button className={tab === "rekap" ? "active" : ""} onClick={() => setTab("rekap")}>Rekap Barang</button>
              <button className={tab === "tagihan" ? "active" : ""} onClick={() => setTab("tagihan")}>Tagihan</button>
            </div>

            <div className="toolbar">
              <div className="search-box">
                <SearchIcon size={14} />
                <input placeholder="Cari nama pembeli…" value={query} onChange={(e) => setQuery(e.target.value)} />
              </div>
              <select value={batchFilter} onChange={(e) => setBatchFilter(e.target.value)}>
                {batches.map((b) => <option key={b} value={b}>{b === "Semua" ? "Semua batch" : `Batch ${b}`}</option>)}
              </select>
              {tab === "rekap" && (
                <>
                  <select value={asalFilter} onChange={(e) => setAsalFilter(e.target.value)}>
                    {["Semua", "KR", "JP", "CN"].map((a) => <option key={a} value={a}>{a === "Semua" ? "Semua asal" : a}</option>)}
                  </select>
                  <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
                    <option value="Semua">Semua status</option>
                    {STATUS_STEPS.map((s) => <option key={s} value={s}>{s}</option>)}
                  </select>
                </>
              )}
            </div>

            {tab === "rekap" ? (
              groupedRekap.length === 0 ? (
                <div className="empty">Tidak ada orderan yang cocok.</div>
              ) : (
                groupedRekap.map(([batchNum, items]) => (
                  <div className="batch-block" key={batchNum}>
                    <div className="batch-header">
                      BATCH {batchNum}
                      <span className="batch-count">{items.length} pembeli</span>
                    </div>
                    <div className="table-wrap">
                      <table className="rekap-table">
                        <thead>
                          <tr>
                            <th>Nama</th>
                            <th>Asal</th>
                            <th>Barang yang Diorder</th>
                            <th>Jumlah</th>
                            <th>Status Barang</th>
                          </tr>
                        </thead>
                        <tbody>
                          {items.map((r) => (
                            <tr key={r.id}>
                              <td className="td-nama">{r.nama}</td>
                              <td><span className="origin-badge" style={{ background: ORIGIN_COLOR[r.asal] || "#6B7686" }}>{r.asal}</span></td>
                              <td>{r.item}</td>
                              <td className="td-center">{r.jumlah}</td>
                              <td><span className="status-pill" style={{ background: STATUS_COLOR[r.status] }}>{r.status}</span></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                ))
              )
            ) : (
              filteredTagihan.length === 0 ? (
                <div className="empty">Tidak ada tagihan yang cocok.</div>
              ) : (
                <div className="table-wrap">
                  <table className="tagihan-table">
                    <thead>
                      <tr>
                        <th>DN Line/Username</th>
                        <th>Batch</th>
                        <th>Barang Diorder</th>
                        <th>Tagihan</th>
                        <th>Total Tagihan</th>
                        <th>Check Pelunasan</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredTagihan.map((g) =>
                        g.items.map((item, idx) => (
                          <tr key={item.id}>
                            {idx === 0 && <td className="td-nama" rowSpan={g.items.length}>{g.nama}</td>}
                            {idx === 0 && <td className="td-center" rowSpan={g.items.length}>{g.batch}</td>}
                            <td>{item.item}</td>
                            <td className="td-right">{currency(item.tagihan)}</td>
                            {idx === 0 && <td className="td-right td-total" rowSpan={g.items.length}>{currency(g.total)}</td>}
                            {idx === 0 && (
                              <td className="td-center" rowSpan={g.items.length}>
                                <label className="pelunasan-cell">
                                  <input type="checkbox" checked={g.lunas} disabled className="pelunasan-check" />
                                  <span className={`pelunasan-label ${g.lunas ? "lunas" : "belum"}`}>{g.lunas ? "Lunas" : "Belum Lunas"}</span>
                                </label>
                              </td>
                            )}
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              )
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GoTracker />);
</script>

<style>

    --paper: #EEF1EF;
    --card: #FFFFFF;
    --line: #D8DEDA;
    --muted: #6B7686;
    --gold: #C98A2B;
    --coral: #D1503B;
    --green: #3F8F5F;
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  .app * { box-sizing: border-box; }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; border-bottom: 2px solid var(--ink);
    background: var(--card);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 34px; height: 34px; border: 2px solid var(--ink); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; background: var(--ink); color: #fff;
  }

  .brand p { margin: 0; font-size: 11.5px; color: var(--muted); }

  .role-toggle { display: flex; border: 1.5px solid var(--ink); border-radius: 20px; overflow: hidden; }

    padding: 6px 14px; font-size: 12.5px; font-weight: 600; border: none; background: var(--card);
    color: var(--ink); cursor: pointer; font-family: inherit;
  }
  .role-toggle button.active { background: var(--ink); color: #fff; }

  .demo-note {
    font-size: 11.5px; color: var(--muted); text-align: center; padding: 7px;
    background: #E4E8E4; border-bottom: 1px solid var(--line);
  }

  .content { max-width: 880px; margin: 0 auto; padding: 22px 18px 60px; }

  .subtabs { display: flex; gap: 6px; margin-bottom: 16px; }

    padding: 7px 16px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card);
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer;
  }
  .subtabs button.active { border-color: var(--ink); color: var(--ink); background: #fff; box-shadow: 2px 2px 0 var(--ink); }

    border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px;
    background: var(--card); color: var(--ink); font-family: inherit;
  }

  .batch-block { margin-bottom: 22px; border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; background: var(--card); }

    background: var(--ink); color: #fff; font-family: 'Space Grotesk', sans-serif; font-weight: 700;

  }
  .batch-count { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 11.5px; opacity: 0.75; }

  .rekap-table td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }

    text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; color: #fff;
    padding: 10px 14px; background: var(--ink); white-space: nowrap;
  }
  .tagihan-table td { padding: 10px 14px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); vertical-align: middle; }
  .tagihan-table td:last-child, .tagihan-table th:last-child { border-right: none; }
  .tagihan-table tr:last-child td { border-bottom: none; }
  .td-right { text-align: right; }
  .td-total { font-weight: 700; background: #F7F8F6; }
  .pelunasan-check { width: 16px; height: 16px; accent-color: var(--green); }
  .pelunasan-cell { display: inline-flex; align-items: center; gap: 6px; }
  .pelunasan-label { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; color: #fff; white-space: nowrap; }
  .pelunasan-label.lunas { background: var(--green); }

  .empty { text-align: center; padding: 40px 10px; color: var(--muted); font-size: 13.5px; }

  .admin-intro {
    background: #fff; border: 1.5px dashed var(--ink); border-radius: 10px; padding: 12px 16px;
    font-size: 12.5px; color: var(--ink); margin-bottom: 18px; line-height: 1.55;
  }
  .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .admin-grid { grid-template-columns: 1fr; } }
