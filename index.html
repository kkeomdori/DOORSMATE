function sheetCsvUrl(sheetName) {
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
}

async function fetchSheetRows(sheetName) {
  const res = await fetch(sheetCsvUrl(sheetName));
  if (!res.ok) throw new Error(`Gagal mengambil sheet "${sheetName}" (status ${res.status})`);
  const csvText = await res.text();
  const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
  return parsed.data;
}

function parseRupiah(val) {
  if (val === null || val === undefined) return 0;
  const cleaned = String(val).replace(/[^0-9]/g, "");
  return cleaned ? parseInt(cleaned, 10) : 0;
}

function groupTagihanRows(rows) {
  const map = new Map();
  rows.forEach((r, i) => {
    const key = String(r.Nama);
    if (!map.has(key)) {
      map.set(key, { id: `t-${Date.now()}-${i}`, nama: String(r.Nama), items: [], total: 0, lunas: true });
    }
    const g = map.get(key);
    const nilai = parseRupiah(r.Tagihan);
    g.items.push({ id: `ti-${Date.now()}-${i}`, batch: String(r.Batch), item: String(r.Barang), tagihan: nilai });
    g.total += nilai;
    if (String(r.Lunas).toLowerCase() !== "ya") g.lunas = false;
  });
  return Array.from(map.values());
}

function currency(n) {
  return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(n || 0);
}

function formatJumlah(val) {
  if (val === null || val === undefined || val === "") return "1 pcs";
  const s = String(val).trim();
  if (/^\d+(\.\d+)?$/.test(s)) {
    const n = parseFloat(s);
    return `${Number.isInteger(n) ? n : s} pcs`;
  }
  return s;
}

function GoTracker() {

  const saveTagihan = setTagihan;

  const [syncStatus, setSyncStatus] = useState("loading"); // loading | live | error
  const [syncError, setSyncError] = useState("");
  const [lastSynced, setLastSynced] = useState(null);

  function mapRekapRow(r, i) {
    return {
      id: `r-${i}-${r.Nama}-${r.Item}`,
      batch: String(r.Batch || "").trim(),
      asal: String(r.Asal || "").toUpperCase(),
      nama: String(r.Nama || ""),
      item: String(r.Item || ""),
      jumlah: r.Jumlah !== undefined && r.Jumlah !== null && r.Jumlah !== "" ? r.Jumlah : 1,
      status: ALL_STATUSES.includes(r.Status) ? r.Status : "DONE CO",
    };
  }

  const syncFromSheets = async () => {
    setSyncStatus("loading");
    setSyncError("");
    try {
      const [rekapRows, tagihanRows] = await Promise.all([
        fetchSheetRows(REKAP_SHEET_NAME),
        fetchSheetRows(TAGIHAN_SHEET_NAME),
      ]);
      if (rekapRows.length > 0) saveRekap(rekapRows.map(mapRekapRow));
      if (tagihanRows.length > 0) saveTagihan(groupTagihanRows(tagihanRows));
      setSyncStatus("live");
      setLastSynced(new Date());
    } catch (err) {
      console.error(err);
      setSyncStatus("error");
      setSyncError("Belum berhasil konek ke Google Sheets — menampilkan data contoh terakhir.");
    }
  };

  const [statusFilter, setStatusFilter] = useState("Semua");

  const availableAsal = useMemo(() => {
    const order = ["KR", "JP", "CN", "INA"];
    const present = new Set(rekap.map((r) => r.asal));
    return order.filter((a) => present.has(a));
  }, [rekap]);

  const [tagihanQuery, setTagihanQuery] = useState("");
  const [tagihanBatchFilter, setTagihanBatchFilter] = useState("Semua");

  const stats = useMemo(() => {
    const batchSet = new Set(rekap.map((r) => `${r.asal}||${r.batch}`));

    const sampaiAdmin = rekap.filter((r) => r.status === "ARRIVED ADMIN").length;
    const belumLunas = tagihan.filter((g) => !g.lunas).length;
    const lunasCount = tagihan.filter((g) => g.lunas).length;
    const persenLunas = tagihan.length ? Math.round((lunasCount / tagihan.length) * 100) : 0;
    return {
      totalBatch: batchSet.size,
      totalPembeli: buyerSet.size,
      sampaiAdmin,
      belumLunas,
      persenLunas,
    };
  }, [rekap, tagihan]);

  const selectTab = (t) => { setTab(t); setSidebarOpen(false); };
  const selectAsal = (a) => { setTab("rekap"); setAsalTab(a); setRekapBatchFilter("Semua"); setSidebarOpen(false); };

  const filteredRekap = useMemo(() => {
    return rekap.filter((r) => {
      if (rekapQuery && !r.nama.toLowerCase().includes(rekapQuery.toLowerCase())) return false;
      if (rekapBatchFilter !== "Semua" && `${r.asal}||${r.batch}` !== rekapBatchFilter) return false;
      if (asalTab !== "Semua" && r.asal !== asalTab) return false;
      if (statusFilter !== "Semua" && r.status !== statusFilter) return false;
      return true;
    });
  }, [rekap, rekapQuery, rekapBatchFilter, asalTab, statusFilter]);

  const rekapBatchOptions = useMemo(() => {
    const seen = new Map();
    rekap
      .filter((r) => asalTab === "Semua" || r.asal === asalTab)
      .forEach((r) => {
        const key = `${r.asal}||${r.batch}`;
        if (!seen.has(key)) seen.set(key, { key, asal: r.asal, batch: r.batch });
      });
    const list = Array.from(seen.values()).sort((a, b) => {
      if (a.asal !== b.asal) return a.asal.localeCompare(b.asal);
      const na = parseInt(a.batch, 10), nb = parseInt(b.batch, 10);
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return nb - na;
      return String(a.batch).localeCompare(String(b.batch));
    });
    return list;
  }, [rekap, asalTab]);

  const groupedRekap = useMemo(() => {
    const byKey = new Map();
    filteredRekap.forEach((r) => {
      const key = `${r.asal}||${r.batch}`;
      if (!byKey.has(key)) byKey.set(key, { key, asal: r.asal, batch: r.batch, items: [] });
      byKey.get(key).items.push(r);
    });
    const groups = Array.from(byKey.values()).map((g) => {
      const counts = {};
      g.items.forEach((it) => { counts[it.status] = (counts[it.status] || 0) + 1; });
      let statusLabel = g.items[0].status, max = 0;
      Object.entries(counts).forEach(([s, c]) => { if (c > max) { max = c; statusLabel = s; } });
      const byNama = new Map();
      g.items.forEach((it) => {
        if (!byNama.has(it.nama)) byNama.set(it.nama, []);
        byNama.get(it.nama).push(it);
      });
      return { ...g, statusLabel, people: Array.from(byNama.entries()).map(([nama, items]) => ({ nama, items })) };
    });
    groups.sort((a, b) => {
      const na = parseInt(a.batch, 10), nb = parseInt(b.batch, 10);
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return nb - na;
      const batchCompare = String(a.batch).localeCompare(String(b.batch));
      if (batchCompare !== 0) return batchCompare;
      return a.asal.localeCompare(b.asal);
    });
    return groups;
  }, [filteredRekap]);

  const tagihanBatchOptions = useMemo(() => {
    const set = new Set();
    tagihan.forEach((g) => g.items.forEach((it) => set.add(it.batch)));

  const filteredTagihan = useMemo(() => {

      .filter((t) => {

        return true;
      })
      .map((t) => ({
        ...t,
        items: tagihanBatchFilter === "Semua" ? t.items : t.items.filter((it) => it.batch === tagihanBatchFilter),
      }));
  }, [tagihan, tagihanQuery, tagihanBatchFilter]);

  return (

          </div>

            <BoxIcon size={16} /> Rekap Barang
          </button>
          {tab === "rekap" && (
            <div className="nav-sub">
              <button className={asalTab === "Semua" ? "active" : ""} onClick={() => selectAsal("Semua")}>Semua Asal</button>
              {availableAsal.map((a) => (
                <button key={a} className={asalTab === a ? "active" : ""} onClick={() => selectAsal(a)}>
                  <span className="asal-dot" style={{ background: ORIGIN_COLOR[a] }}></span>{a}
                </button>
              ))}
            </div>
          )}
          <button className={`nav-item ${tab === "tagihan" ? "active" : ""}`} onClick={() => selectTab("tagihan")}>
            <ReceiptIcon size={16} /> Tagihan
          </button>
        </nav>
      </aside>

      <div className="main">
        <div className="topbar">
          <button className="hamburger" onClick={() => setSidebarOpen(true)}><MenuIcon size={20} /></button>
          <h2>{tab === "rekap" ? "Rekap Barang" : "Tagihan"}</h2>
          <div className={`sync-pill ${syncStatus}`}>
            {syncStatus === "loading" && "Memuat…"}
            {syncStatus === "live" && "Live"}
            {syncStatus === "error" && "Gagal sinkron"}
            <button className="sync-refresh" onClick={syncFromSheets} title="Refresh data"><RefreshIcon size={13} /></button>
          </div>
        </div>

        <div className="content">
          <div className="hero">
            <div className="hero-circle c1"></div>
            <div className="hero-circle c2"></div>
            <div className="hero-text">
              <h3>Pantau pesanan grup order kamu<br />di satu tempat</h3>
              <p>Data rekap barang dan tagihan diperbarui otomatis dari Google Sheets.</p>
              {syncStatus === "live" && lastSynced && (
                <span className="hero-sync">Diperbarui {lastSynced.toLocaleTimeString("id-ID")}</span>
              )}
              {syncStatus === "error" && <span className="hero-sync error">{syncError}</span>}

                  </select>
                </div>

                {groupedRekap.length === 0 ? (
                  <div className="empty">Tidak ada orderan yang cocok.</div>
                ) : (
                  groupedRekap.map((g) => (
                    <div className="batch-block" key={g.key}>
                      <div className="batch-header">
                        <span className="batch-code">
                          Batch <span className="batch-num">{g.batch}</span>
                          <span className="origin-badge" style={{ background: ORIGIN_COLOR[g.asal] || "#6B7686" }}>{g.asal}</span>
                        </span>
                        <span className="status-stamp" style={{ background: STATUS_COLOR[g.statusLabel] }}>STATUS: {g.statusLabel}</span>
                      </div>
                      <div className="table-wrap">
                        <table className="rekap-table">
                          <thead>
                            <tr>
                              <th>Nama</th>
                              <th>Barang yang Diorder</th>
                              <th>Jumlah</th>
                            </tr>
                          </thead>
                          <tbody>
                            {g.people.map((p) =>
                              p.items.map((it, idx) => (
                                <tr key={it.id}>
                                  {idx === 0 && <td className="td-nama" rowSpan={p.items.length}>{p.nama}</td>}
                                  <td>{it.item}</td>
                                  <td className="td-center">{formatJumlah(it.jumlah)}</td>
                                </tr>
                              ))
                            )}
                          </tbody>
                        </table>
                      </div>
                      <div className="batch-footer">
                        Total {g.items.length} barang · {g.people.length} pembeli
                      </div>
                    </div>
                  ))
                )}
              </>
            ) : (
              <>
                <div className="toolbar">
                  <div className="search-box">
                    <SearchIcon size={14} />
                    <input placeholder="Cari nama pembeli…" value={tagihanQuery} onChange={(e) => setTagihanQuery(e.target.value)} />
                  </div>
                  <select value={tagihanBatchFilter} onChange={(e) => setTagihanBatchFilter(e.target.value)}>
                    <option value="Semua">Semua batch</option>
                    {tagihanBatchOptions.map((b) => <option key={b} value={b}>Batch {b}</option>)}
                  </select>
                </div>

                {filteredTagihan.length === 0 ? (
                  <div className="empty">Tidak ada tagihan yang cocok.</div>
                ) : (
                  <div className="table-wrap">
                    <table className="tagihan-table">
                      <thead>
                        <tr>
                          <th>DN Line/Username</th>
                          <th>Batch</th>
                          <th>Barang Diorder</th>
                          <th>Tagihan</th>
                          <th>Total Tagihan</th>
                          <th>Status Pelunasan</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filteredTagihan.map((g, gIdx) =>
                          g.items.map((item, idx) => (
                            <tr key={item.id} className={gIdx % 2 === 1 ? "row-alt" : ""}>
                              {idx === 0 && <td className="td-nama" rowSpan={g.items.length}>{g.nama}</td>}
                              <td className="td-center">{item.batch}</td>
                              <td>{item.item}</td>
                              <td className="td-right">{currency(item.tagihan)}</td>
                              {idx === 0 && <td className="td-right td-total" rowSpan={g.items.length}>{currency(g.total)}</td>}
                              {idx === 0 && (
                                <td className="td-center" rowSpan={g.items.length}>
                                  <span className={`pelunasan-label ${g.lunas ? "lunas" : "belum"}`}>{g.lunas ? "Lunas" : "Belum Lunas"}</span>
                                </td>
                              )}
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GoTracker />);
</script>
