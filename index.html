function sheetCsvUrl(sheetName) {
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
}

async function fetchSheetRows(sheetName) {
  const res = await fetch(sheetCsvUrl(sheetName));
  if (!res.ok) throw new Error(`Gagal mengambil sheet "${sheetName}" (status ${res.status})`);

  const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });

function parseRupiah(val) {
  if (val === null || val === undefined) return 0;
  const cleaned = String(val).replace(/[^0-9]/g, "");
  return cleaned ? parseInt(cleaned, 10) : 0;
}

function groupTagihanRows(rows) {
  const map = new Map();
  rows.forEach((r, i) => {
    const key = String(r.Nama);
    if (!map.has(key)) {
      map.set(key, { id: `t-${Date.now()}-${i}`, nama: String(r.Nama), items: [], total: 0, lunas: true });
    }
    const g = map.get(key);
    const nilai = parseRupiah(r.Tagihan);
    g.items.push({ id: `ti-${Date.now()}-${i}`, batch: String(r.Batch), item: String(r.Barang), tagihan: nilai });
    g.total += nilai;
    if (String(r.Lunas).toLowerCase() !== "ya") g.lunas = false;
  });
  return Array.from(map.values());
}

function currency(n) {
  return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(n || 0);
}

function formatJumlah(val) {
  if (val === null || val === undefined || val === "") return "1 pcs";
  const s = String(val).trim();
  if (/^\d+(\.\d+)?$/.test(s)) {
    const n = parseFloat(s);
    return `${Number.isInteger(n) ? n : s} pcs`;
  }
  return s;
}

  const saveTagihan = setTagihan;

  const [syncError, setSyncError] = useState("");
  const [lastSynced, setLastSynced] = useState(null);

  function mapRekapRow(r, i) {
    return {
      id: `r-${i}-${r.Nama}-${r.Item}`,
      batch: String(r.Batch || "").trim(),
      asal: String(r.Asal || "").toUpperCase(),
      nama: String(r.Nama || ""),
      item: String(r.Item || ""),
      jumlah: r.Jumlah !== undefined && r.Jumlah !== null && r.Jumlah !== "" ? r.Jumlah : 1,
      status: ALL_STATUSES.includes(r.Status) ? r.Status : "DONE CO",
    };
  }

  const syncFromSheets = async () => {
    setSyncStatus("loading");
    setSyncError("");
    try {
      const [rekapRows, tagihanRows] = await Promise.all([
        fetchSheetRows(REKAP_SHEET_NAME),
        fetchSheetRows(TAGIHAN_SHEET_NAME),
      ]);
      if (rekapRows.length > 0) saveRekap(rekapRows.map(mapRekapRow));
      if (tagihanRows.length > 0) saveTagihan(groupTagihanRows(tagihanRows));
      setSyncStatus("live");
      setLastSynced(new Date());
    } catch (err) {
      console.error(err);
      setSyncStatus("error");
      setSyncError("Belum berhasil konek ke Google Sheets — menampilkan data contoh terakhir.");
    }
  };

  useEffect(() => { syncFromSheets(); }, []);

  const [tab, setTab] = useState("rekap");

  const [rekapQuery, setRekapQuery] = useState("");
  const [rekapBatchFilter, setRekapBatchFilter] = useState("Semua");
  const [asalTab, setAsalTab] = useState("Semua");
  const [statusFilter, setStatusFilter] = useState("Semua");

  const availableAsal = useMemo(() => {
    const order = ["KR", "JP", "CN", "INA"];
    const present = new Set(rekap.map((r) => r.asal));
    return order.filter((a) => present.has(a));
  }, [rekap]);

  const [tagihanQuery, setTagihanQuery] = useState("");
  const [tagihanBatchFilter, setTagihanBatchFilter] = useState("Semua");

  const filteredRekap = useMemo(() => {
    return rekap.filter((r) => {
      if (rekapQuery && !r.nama.toLowerCase().includes(rekapQuery.toLowerCase())) return false;
      if (rekapBatchFilter !== "Semua" && `${r.asal}||${r.batch}` !== rekapBatchFilter) return false;
      if (asalTab !== "Semua" && r.asal !== asalTab) return false;
      if (statusFilter !== "Semua" && r.status !== statusFilter) return false;
      return true;
    });
  }, [rekap, rekapQuery, rekapBatchFilter, asalTab, statusFilter]);

  const rekapBatchOptions = useMemo(() => {
    const seen = new Map();
    rekap
      .filter((r) => asalTab === "Semua" || r.asal === asalTab)
      .forEach((r) => {
        const key = `${r.asal}||${r.batch}`;
        if (!seen.has(key)) seen.set(key, { key, asal: r.asal, batch: r.batch });
      });
    const list = Array.from(seen.values()).sort((a, b) => {
      if (a.asal !== b.asal) return a.asal.localeCompare(b.asal);
      const na = parseInt(a.batch, 10), nb = parseInt(b.batch, 10);
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return nb - na;
      return String(a.batch).localeCompare(String(b.batch));
    });
    return list;
  }, [rekap, asalTab]);

  const groupedRekap = useMemo(() => {
    const byKey = new Map();
    filteredRekap.forEach((r) => {
      const key = `${r.asal}||${r.batch}`;
      if (!byKey.has(key)) byKey.set(key, { key, asal: r.asal, batch: r.batch, items: [] });
      byKey.get(key).items.push(r);
    });
    const groups = Array.from(byKey.values()).map((g) => {
      const counts = {};
      g.items.forEach((it) => { counts[it.status] = (counts[it.status] || 0) + 1; });
      let statusLabel = g.items[0].status, max = 0;
      Object.entries(counts).forEach(([s, c]) => { if (c > max) { max = c; statusLabel = s; } });
      const byNama = new Map();
      g.items.forEach((it) => {
        if (!byNama.has(it.nama)) byNama.set(it.nama, []);
        byNama.get(it.nama).push(it);
      });
      return { ...g, statusLabel, people: Array.from(byNama.entries()).map(([nama, items]) => ({ nama, items })) };
    });
    groups.sort((a, b) => {
      if (a.asal !== b.asal) return a.asal.localeCompare(b.asal);
      const na = parseInt(a.batch, 10), nb = parseInt(b.batch, 10);
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return nb - na;
      return String(a.batch).localeCompare(String(b.batch));
    });
    return groups;
  }, [filteredRekap]);

  const tagihanBatchOptions = useMemo(() => {
    const set = new Set();

  const filteredTagihan = useMemo(() => {
    return tagihan
      .filter((t) => {
        if (tagihanQuery && !t.nama.toLowerCase().includes(tagihanQuery.toLowerCase())) return false;

        return true;
      })
      .map((t) => ({
        ...t,
        items: tagihanBatchFilter === "Semua" ? t.items : t.items.filter((it) => it.batch === tagihanBatchFilter),
      }));
  }, [tagihan, tagihanQuery, tagihanBatchFilter]);

      </div>
      <div className={`sync-note ${syncStatus}`}>
        {syncStatus === "loading" && "Memuat data terbaru dari Google Sheets…"}
        {syncStatus === "live" && lastSynced && `Data live dari Google Sheets · diperbarui ${lastSynced.toLocaleTimeString("id-ID")}`}
        {syncStatus === "error" && syncError}
        <button className="sync-refresh" onClick={syncFromSheets}>⟳ Refresh</button>
      </div>

      <div className="content">
        <div className="subtabs">
          <button className={tab === "rekap" ? "active" : ""} onClick={() => setTab("rekap")}>Rekap Barang</button>
          <button className={tab === "tagihan" ? "active" : ""} onClick={() => setTab("tagihan")}>Tagihan</button>
        </div>

        {tab === "rekap" ? (
          <>
            {availableAsal.length > 1 && (
              <div className="asal-tabs">
                <button className={asalTab === "Semua" ? "active" : ""} onClick={() => { setAsalTab("Semua"); setRekapBatchFilter("Semua"); }}>Semua</button>
                {availableAsal.map((a) => (
                  <button
                    key={a}
                    className={asalTab === a ? "active" : ""}
                    style={asalTab === a ? { background: ORIGIN_COLOR[a], borderColor: ORIGIN_COLOR[a] } : { color: ORIGIN_COLOR[a], borderColor: ORIGIN_COLOR[a] }}
                    onClick={() => { setAsalTab(a); setRekapBatchFilter("Semua"); }}
                  >
                    {a}
                  </button>
                ))}
              </div>
            )}
            <div className="toolbar">
              <div className="search-box">
                <SearchIcon size={14} />
                <input placeholder="Cari nama pembeli…" value={rekapQuery} onChange={(e) => setRekapQuery(e.target.value)} />
              </div>
              <select value={rekapBatchFilter} onChange={(e) => setRekapBatchFilter(e.target.value)}>
                <option value="Semua">Semua batch</option>
                {rekapBatchOptions.map((b) => <option key={b.key} value={b.key}>Batch {b.batch}{asalTab === "Semua" ? ` · ${b.asal}` : ""}</option>)}
              </select>
              <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
                <option value="Semua">Semua status</option>
                {ALL_STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>

            {groupedRekap.length === 0 ? (
              <div className="empty">Tidak ada orderan yang cocok.</div>
            ) : (
              groupedRekap.map((g) => (

                              <label className="pelunasan-cell">
                                <input type="checkbox" checked={g.lunas} disabled className="pelunasan-check" />
                                <span className={`pelunasan-label ${g.lunas ? "lunas" : "belum"}`}>{g.lunas ? "Lunas" : "Belum Lunas"}</span>
                              </label>
                            </td>
                          )}
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GoTracker />);
</script>
